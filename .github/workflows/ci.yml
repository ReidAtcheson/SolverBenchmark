name: build-and-test
on: [push, pull_request]
jobs:
  linux:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libblas-dev
      - name: Build SuperLU 6.0.1
        run: |
          curl -fsSL https://github.com/xiaoyeli/superlu/archive/refs/tags/v6.0.1.tar.gz -o /tmp/superlu.tar.gz
          echo '6c5a3a9a224cb2658e9da15a6034eed44e45f6963f5a771a6b4562f7afb8f549  /tmp/superlu.tar.gz' | sha256sum -c -
          tar -xzf /tmp/superlu.tar.gz -C /tmp
          cmake -S /tmp/superlu-6.0.1 -B /tmp/superlu-build -DCMAKE_INSTALL_PREFIX=/tmp/superlu -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON -Denable_tests=OFF -Denable_examples=OFF
          cmake --build /tmp/superlu-build -j2
          cmake --install /tmp/superlu-build
      - run: python -m pip install -e .
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSOLVER_BENCHMARK_BUILD_SUPERLU=ON -DCMAKE_PREFIX_PATH=/tmp/superlu
      - run: cmake --build build -j2
      - run: ctest --test-dir build --output-on-failure
      - run: solver-benchmark run examples/benchmark-profile.json --deployment examples/deployment.json --output results/ci
      - run: solver-benchmark report results/ci --output results/report.html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.runner }}
          path: results/
