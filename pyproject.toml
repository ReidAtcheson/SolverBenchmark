[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "solver-benchmark"
version = "0.1.0"
description = "Process-isolated sparse linear solver benchmarks"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["jsonschema==4.26.0", "rfc8785==0.1.4"]
[project.scripts]
solver-benchmark = "solver_benchmark.cli:main"
[tool.setuptools.packages.find]
where = ["python"]
[tool.setuptools.package-data]
solver_benchmark = ["*.json"]
